name: Validate lineage data

on:
  push:
    paths:
      - 'index.html'
      - 'scripts/validate-lineage.js'
      - '.github/workflows/validate-lineage.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/validate-lineage.js'
      - '.github/workflows/validate-lineage.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate-lineage.js
